name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ShortlinksCore tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Run ShortlinksCore tests
        run: |
          xcodebuild test \
            -project Shortlinks.xcodeproj \
            -scheme ShortlinksCoreTests \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
