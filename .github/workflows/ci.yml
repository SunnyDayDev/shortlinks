name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ShortlinksCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # XcodeGen (latest) генерирует проект в новом формате pbxproj — выбираем
      # новейший установленный Xcode, чтобы xcodebuild смог его открыть.
      - name: Select latest Xcode
        run: sudo xcode-select -switch "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Run ShortlinksCore tests
        run: |
          xcodebuild test \
            -project Shortlinks.xcodeproj \
            -scheme ShortlinksCoreTests \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
