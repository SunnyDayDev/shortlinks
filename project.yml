name: Shortlinks

options:
  bundleIdPrefix: com.shortlinks
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"            # Swift 5 language mode (без strict concurrency)
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    from: 1.3.0

schemes:
  ShortlinksCoreTests:
    build:
      targets:
        ShortlinksCore: all
        ShortlinksCoreTests: [test]
    test:
      targets:
        - ShortlinksCoreTests

targets:

  ShortlinksCore:
    type: library.static
    platform: macOS
    sources:
      - Sources/ShortlinksCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shortlinks.core

  ShortlinksApp:
    type: application
    platform: macOS
    sources:
      - Sources/ShortlinksApp
    dependencies:
      - target: ShortlinksCore
      # CLI вкладывается в бандл (Contents/Helpers/shortlinks) и подписывается при копировании,
      # чтобы быть доступным без отдельной установки. См. change bundle-cli-with-app.
      # Путь Helpers (а не Contents/MacOS) — чтобы имя `shortlinks` не конфликтовало с
      # главным исполняемым `Shortlinks` на регистронезависимом APFS. См. change
      # fix-cli-bundle-path-collision.
      - target: shortlinks-cli
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: Sources/ShortlinksApp/Info.plist
      properties:
        CFBundleDisplayName: Shortlinks
        CFBundleName: Shortlinks
        # Языки интерфейса в каталоге. Перевод на другие языки добавляется в
        # Localizable.xcstrings и сюда. См. change extract-strings-and-icons.
        CFBundleLocalizations: [ru]
        # true = фоновый агент: только меню-бар, без постоянной иконки в Dock.
        # Открытие sl:// в фоне (активная многоразовая ссылка без пароля) проходит тихо.
        # Когда нужен UI (пароль/ненайдена/заблокирована/подтверждение), приложение
        # временно повышается до .regular через NSApp.setActivationPolicy и показывает
        # окно, затем возвращается в .accessory. Запуск самого процесса-обработчика
        # неустраним: macOS резолвит схему sl через LaunchServices. См. change
        # deeplink-silent-open.
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        CFBundleURLTypes:
          - CFBundleURLName: com.shortlinks.app.sl
            CFBundleURLSchemes: [sl]
    settings:
      base:
        PRODUCT_NAME: Shortlinks
        PRODUCT_BUNDLE_IDENTIFIER: com.shortlinks.app
        DEVELOPMENT_LANGUAGE: ru        # язык-источник каталога (CFBundleDevelopmentRegion)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Подпись самоподписанным сертификатом из login-keychain.
        # Имя (CN) — см. `security find-identity -p codesigning`.
        # Для ad-hoc сборки без сертификата верните CODE_SIGN_IDENTITY: "-".
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "shortlinks-app"
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO

  shortlinks-cli:
    type: tool
    platform: macOS
    sources:
      - Sources/shortlinks-cli
    dependencies:
      - target: ShortlinksCore
      - package: ArgumentParser
    settings:
      base:
        PRODUCT_NAME: shortlinks
        PRODUCT_BUNDLE_IDENTIFIER: com.shortlinks.cli

  ShortlinksCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/ShortlinksCoreTests
    dependencies:
      - target: ShortlinksCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shortlinks.core.tests
        GENERATE_INFOPLIST_FILE: YES
